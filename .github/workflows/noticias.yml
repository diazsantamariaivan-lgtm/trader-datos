name: noticias (cada pocas horas)
on:
  schedule:
    - cron: '17 5-23/2 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/noticias.mjs
permissions:
  contents: write
concurrency:
  group: noticias
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar noticias
        run: node scripts/noticias.mjs
      - name: Publicar en la rama news
        run: |
          cd out
          git init -q -b news
          git config user.name "datos"
          git config user.email "datos@users.noreply.github.com"
          git add -A
          git commit -q -m "noticias $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" news
