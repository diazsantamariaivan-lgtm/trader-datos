name: calendario económico (cada pocas horas)
on:
  schedule:
    - cron: '23 4,10,16,22 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/calendario.mjs
permissions:
  contents: write
concurrency:
  group: calendario
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar calendario
        run: node scripts/calendario.mjs
      - name: Publicar en la rama cal
        run: |
          cd out
          git init -q -b cal
          git config user.name "datos"
          git config user.email "datos@users.noreply.github.com"
          git add -A
          git commit -q -m "calendario $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cal
