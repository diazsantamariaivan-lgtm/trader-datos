name: futuros (panel en vivo y sensibilidades)
on:
  schedule:
    - cron: '*/30 5-22 * * 1-5'
    - cron: '30 22,23 * * 0'
  workflow_dispatch:
  push:
    paths:
      - scripts/futuros.mjs
permissions:
  contents: write
concurrency:
  group: futuros
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar futuros y calcular sensibilidades
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/futuros.mjs
      - name: Publicar en la rama fut
        run: |
          cd out
          git init -q -b fut
          git config user.name "datos"
          git config user.email "datos@users.noreply.github.com"
          git add -A
          git commit -q -m "futuros $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" fut
