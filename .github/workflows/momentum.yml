name: momentum (cada día)
on:
  schedule:
    - cron: '50 4 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - scripts/momentum.mjs
permissions:
  contents: write
concurrency:
  group: mom
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar momentum
        run: node scripts/momentum.mjs
      - name: Publicar en la rama mom
        run: |
          cd out
          git init -q -b mom
          git config user.name "datos"
          git config user.email "datos@users.noreply.github.com"
          git add -A
          git commit -q -m "momentum $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" mom
