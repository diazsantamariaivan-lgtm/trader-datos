name: fundamentales (cada día)
on:
  schedule:
    - cron: '30 3 * * 1-6'
  workflow_dispatch:
  push:
    paths:
      - scripts/fundam.mjs
permissions:
  contents: write
concurrency:
  group: fund
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar fundamentales
        run: node scripts/fundam.mjs
      - name: Publicar en la rama fund
        run: |
          cd out
          git init -q -b fund
          git config user.name "datos"
          git config user.email "datos@users.noreply.github.com"
          git add -A
          git commit -q -m "fundamentales $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" fund
