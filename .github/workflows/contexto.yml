name: contexto de mercado (VIX, índices, resultados)
on:
  schedule:
    - cron: '40 6-22/2 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - scripts/contexto.mjs
permissions:
  contents: write
concurrency:
  group: contexto
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar contexto
        run: node scripts/contexto.mjs
      - name: Publicar en la rama ctx
        run: |
          cd out
          git init -q -b ctx
          git config user.name "datos"
          git config user.email "datos@users.noreply.github.com"
          git add -A
          git commit -q -m "contexto $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ctx
