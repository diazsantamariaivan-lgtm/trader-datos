name: publicar la app (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - app/**
      - scripts/publicar_app.py
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generar la app desde app/trader_a_mano.html
        run: python3 scripts/publicar_app.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: d
        uses: actions/deploy-pages@v4
