name: piloto automatico (cada 15 min)
on:
  schedule:
    - cron: '7,22,37,52 7-21 * * 1-5'
  workflow_dispatch:
  workflow_run:
    workflows: ["cotizaciones (cada 5 min)"]
    types: [completed]
  push:
    paths:
      - bot.json
      - app/trader_a_mano.html
      - scripts/bot.mjs
permissions:
  contents: write
concurrency:
  group: piloto
  cancel-in-progress: false
jobs:
  piloto:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar jsdom
        run: npm install --no-save --no-audit --no-fund jsdom@24
      - name: Traer cotizaciones y cartera guardada
        run: |
          git clone -q --depth 1 -b quotes "https://github.com/${{ github.repository }}.git" qdata
          cp qdata/q.json q.json
          git clone -q --depth 1 -b fund "https://github.com/${{ github.repository }}.git" fdata && cp fdata/f.json f.json || echo "sin fundamentales"
          git clone -q --depth 1 -b news "https://github.com/${{ github.repository }}.git" ndata && cp ndata/n.json n.json || echo "sin noticias"
          git clone -q --depth 1 -b ctx "https://github.com/${{ github.repository }}.git" xdata && cp xdata/x.json x.json || echo "sin contexto"
          git clone -q --depth 1 -b ana "https://github.com/${{ github.repository }}.git" adata && cp adata/a.json a.json || echo "sin analistas"
          git clone -q --depth 1 -b mom "https://github.com/${{ github.repository }}.git" mdata && cp mdata/m.json m.json || echo "sin momentum"
          git clone -q --depth 1 -b check "https://github.com/${{ github.repository }}.git" cdata && cp cdata/c.json c.json || echo "sin contraste"
          R="https://github.com/${{ github.repository }}.git"
          git ls-remote --exit-code --heads "$R" bot >/dev/null 2>&1; RC=$?
          if [ $RC -eq 0 ]; then git clone -q --depth 1 -b bot "$R" botstate || { echo "ERROR: la rama bot existe pero no se pudo clonar; se aborta para no borrar la cartera"; exit 1; }
          elif [ $RC -eq 2 ]; then echo "sin cartera previa"
          else echo "ERROR: no se pudo consultar GitHub; se aborta"; exit 1; fi
      - name: Ejecutar el piloto
        env:
          REPO: ${{ github.repository }}
          NTFY: ${{ secrets.NTFY_TOPIC }}
          CLAVE: ${{ secrets.CARTERA_CLAVE }}
          APRTEMA: ${{ secrets.APRENDE_TEMA }}
        run: node scripts/bot.mjs
      - name: Guardar la cartera en la rama bot
        run: |
          if [ -f botout/state.enc.json ]; then
            cd botout
            git init -q -b bot
            git config user.name "piloto"
            git config user.email "piloto@users.noreply.github.com"
            git add -A
            git commit -q -m "cartera $(date -u +%FT%TZ)"
            git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" bot
          fi
      - name: Enviar avisos
        if: success()
        run: node scripts/avisos.mjs
